name: Deploy → reimotors.com.br

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar lftp
        run: sudo apt-get install -y lftp

      - name: Deploy via lftp
        env:
          FTP_HOST: ${{ secrets.FTP_HOST_REIMOTORS }}
          FTP_USER: ${{ secrets.FTP_USER_REIMOTORS }}
          FTP_PASS: ${{ secrets.FTP_PASS_REIMOTORS }}
          FTP_PATH: ${{ secrets.FTP_PATH_REIMOTORS }}
        run: |
          lftp -u "$FTP_USER,$FTP_PASS" "ftp://$FTP_HOST" <<LFTP_SCRIPT
          set ftp:passive-mode yes
          set net:timeout 30
          set net:max-retries 3
          set ssl:verify-certificate no

          # Deploy includes/ para o diretório compartilhado (mesmo ../includes/ da conta)
          mirror --reverse --verbose --no-empty-dirs --parallel=3 \
            --exclude-glob db.php \
            --exclude-glob secrets.php \
            includes/ ../includes/

          # Deploy public_html/ para o docroot do reimotors.com.br
          mirror --reverse --verbose --no-empty-dirs --parallel=3 \
            --exclude-glob .gitkeep \
            public_html/ $FTP_PATH

          bye
          LFTP_SCRIPT
