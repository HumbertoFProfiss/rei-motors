name: Deploy → reimotorsbr.com.br

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Upload via Python puro (ftplib da biblioteca padrao) - evita depender
      # de "apt-get install lftp", que falha quando os mirrors do Ubuntu tem
      # instabilidade de rede do lado do runner do GitHub (ja aconteceu
      # varias vezes e travou o deploy sem nenhuma relacao com o nosso
      # codigo). So faz upload/sobrescrita, nunca deleta nada no servidor -
      # mesmo comportamento do lftp mirror sem --delete que usavamos antes.
      - name: Deploy via FTP (python ftplib)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER_REIMOTORS }}
          FTP_PASS: ${{ secrets.FTP_PASS_REIMOTORS }}
          FTP_PATH: ${{ secrets.FTP_PATH_REIMOTORS }}
        run: |
          python3 <<'PYEOF'
          import ftplib
          import os

          host = os.environ["FTP_HOST"]
          user = os.environ["FTP_USER"]
          password = os.environ["FTP_PASS"]
          remote_docroot = os.environ["FTP_PATH"]

          ftp = ftplib.FTP(host, timeout=30)
          ftp.login(user, password)
          ftp.set_pasv(True)

          # remote_dir precisa ja existir no servidor (e o caso de ../includes
          # e do docroot do reimotorsbr.com.br) - so cria as subpastas novas
          # que forem aparecendo dentro dela conforme a recursao desce.
          def enviar_pasta(local_dir, remote_dir, excluir):
              for nome in sorted(os.listdir(local_dir)):
                  if nome in excluir:
                      continue
                  caminho_local = os.path.join(local_dir, nome)
                  caminho_remoto = remote_dir.rstrip("/") + "/" + nome
                  if os.path.isdir(caminho_local):
                      try:
                          ftp.mkd(caminho_remoto)
                      except ftplib.error_perm:
                          pass
                      enviar_pasta(caminho_local, caminho_remoto, excluir)
                  else:
                      with open(caminho_local, "rb") as f:
                          ftp.storbinary(f"STOR {caminho_remoto}", f)
                      print(f"enviado: {caminho_remoto}")

          # includes/ vai pro diretorio compartilhado (mesmo ../includes/ da conta)
          enviar_pasta("includes", "../includes", {"db.php", "secrets.php"})

          # public_html/ vai pro docroot do reimotorsbr.com.br
          enviar_pasta("public_html", remote_docroot, {".gitkeep"})

          ftp.quit()
          print("Deploy concluido.")
          PYEOF
