name: Deploy → worldcred.com.br

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar lftp
        run: sudo apt-get install -y lftp

      - name: Deploy via lftp
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          lftp -u "$FTP_USER,$FTP_PASS" "ftp://$FTP_HOST" <<'LFTP_SCRIPT'
          set ftp:passive-mode yes
          set net:timeout 30
          set net:max-retries 3
          set ssl:verify-certificate no

          # Força upload dos arquivos críticos (sobrescreve independente de timestamp)
          put -O includes/ includes/config.php
          put -O includes/ includes/functions.php

          # Deploy includes/ (excluindo credenciais que só existem no servidor)
          mirror --reverse --verbose --no-empty-dirs --parallel=3 \
            --exclude-glob db.php \
            --exclude-glob secrets.php \
            includes/ includes/

          # Deploy public_html/ diretamente na raiz do servidor (onde o site roda)
          mirror --reverse --verbose --no-empty-dirs --parallel=3 \
            --exclude-glob .gitkeep \
            public_html/ ./

          bye
          LFTP_SCRIPT
