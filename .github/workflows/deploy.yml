name: Deploy → worldcred.com.br

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Upload arquivos alterados via FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          SKIP="^(includes/db\.php|includes/secrets\.php|.*\.sql|phpstan|iniciar_servidor|migracoes/|logs/|\.github/|\.gitignore|phpstan\.neon)"

          git diff-tree --no-commit-id -r --name-only HEAD | while IFS= read -r file; do
            if echo "$file" | grep -qE "$SKIP"; then
              echo "SKIP: $file"
              continue
            fi
            if [ -f "$file" ]; then
              echo "UPLOAD: $file"
              curl --silent --show-error --ftp-create-dirs \
                --user "${FTP_USER}:${FTP_PASS}" \
                -T "$file" \
                "ftp://${FTP_HOST}/${file}"
            fi
          done
