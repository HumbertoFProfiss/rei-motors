name: Deploy → worldcred.com.br

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar lftp
        run: sudo apt-get install -y lftp

      - name: Deploy via lftp
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          lftp -u "$FTP_USER,$FTP_PASS" "ftp://$FTP_HOST" <<'LFTP_SCRIPT'
          set ftp:passive-mode yes
          set net:timeout 30
          set net:max-retries 3
          set ssl:verify-certificate no
          mirror --reverse --verbose \
            --no-empty-dirs \
            --parallel=3 \
            --exclude-glob .git \
            --exclude-glob .gitignore \
            --exclude-glob .github \
            --exclude-glob includes/db.php \
            --exclude-glob includes/secrets.php \
            --exclude-glob "*.sql" \
            --exclude-glob migracoes \
            --exclude-glob logs \
            --exclude-glob phpstan.phar \
            --exclude-glob phpstan.neon \
            --exclude-glob iniciar_servidor.bat \
            . .
          bye
          LFTP_SCRIPT
