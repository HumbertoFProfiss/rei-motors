name: Deploy → worldcred.com.br

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar lftp
        run: sudo apt-get install -y lftp

      - name: Verificar arquivos locais
        run: |
          echo "=== functions.php local ==="
          wc -c includes/functions.php
          grep -n "gerarHashArquivo.*jpg\|@chmod" includes/functions.php

      - name: Force upload arquivos críticos (curl)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          curl -v --ftp-pasv --insecure \
            --user "$FTP_USER:$FTP_PASS" \
            -T includes/functions.php \
            "ftp://$FTP_HOST/includes/functions.php"
          curl -v --ftp-pasv --insecure \
            --user "$FTP_USER:$FTP_PASS" \
            -T includes/config.php \
            "ftp://$FTP_HOST/includes/config.php"

      - name: Deploy via lftp
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          lftp -u "$FTP_USER,$FTP_PASS" "ftp://$FTP_HOST" <<'LFTP_SCRIPT'
          set ftp:passive-mode yes
          set net:timeout 30
          set net:max-retries 3
          set ssl:verify-certificate no

          # Deploy includes/ (excluindo credenciais que só existem no servidor)
          mirror --reverse --verbose --no-empty-dirs --parallel=3 \
            --exclude-glob db.php \
            --exclude-glob secrets.php \
            includes/ includes/

          # Deploy public_html/ diretamente na raiz do servidor (onde o site roda)
          mirror --reverse --verbose --no-empty-dirs --parallel=3 \
            --exclude-glob .gitkeep \
            public_html/ ./

          bye
          LFTP_SCRIPT
