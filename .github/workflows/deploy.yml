name: Deploy → worldcred.com.br

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apaga estado anterior (força re-sync completo)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          curl --silent --user "${FTP_USER}:${FTP_PASS}" \
            --quote "DELE .ftp-deploy-sync-state.json" \
            "ftp://${FTP_HOST}/" || true

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./
          server-dir: /
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            includes/db.php
            includes/secrets.php
            *.sql
            phpstan.phar
            phpstan.neon
            iniciar_servidor.bat
            migracoes/**
            logs/**
            rei_motors_data.sql
            diag_upload.php
